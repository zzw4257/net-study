# nginx_proxy.conf - Nginx configuration for the reverse proxy
# Place this in /etc/nginx/sites-available/ and create a symlink in /etc/nginx/sites-enabled/

server {
    # Listen on the standard HTTP port 80 for IPv4 and IPv6.
    listen 80;
    listen [::]:80;

    # The domain name that will point to this server.
    # The user should create an A record for 'proxy.mydomain.com' pointing to the public server's IPv4.
    server_name proxy.mydomain.com;

    location / {
        # The core of the reverse proxy:
        # Pass all incoming requests to the local port that frp is forwarding traffic to.
        # Nginx is forwarding the request to itself on port 7080, where frps is listening
        # and ready to tunnel it to the local machine.
        proxy_pass http://127.0.0.1:7080;

        # Standard proxy headers to pass along client information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
