# frpc.ini - Configuration for the frp client (to be run on the local machine)
[common]
# The IP address of the public server where frps is running.
server_addr = YOUR_PUBLIC_SERVER_IP
# The port frps is listening on. Must match bind_port in frps.ini.
server_port = 7000

[web_service]
# Type of protocol to proxy.
type = tcp
# The local port your web service is running on (e.g., python -m http.server 8080).
local_port = 8080
# The port on the *public server* that will be opened to expose your local service.
# Accessing YOUR_PUBLIC_SERVER_IP:7080 will forward traffic to your local machine's port 8080.
remote_port = 7080
